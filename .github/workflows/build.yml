name: Build iPhone IPA (unsigned)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPhone
        run: >-
          xcodebuild -project DemoWallet.xcodeproj -scheme DemoWallet
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/DemoWallet.app dist/Payload/
          cd dist
          zip -qr DemoWallet-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DemoWallet-unsigned-IPA
          path: dist/DemoWallet-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
